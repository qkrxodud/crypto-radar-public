<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 헤더 .brand .dot 모티프: 주황 그라데이션 라운드 사각형 + 중앙 다크 dot + 링 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7931a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#g)"/>
  <!-- 다크 링 -->
  <circle cx="32" cy="32" r="15" fill="none" stroke="#0b1020" stroke-width="3.5" stroke-opacity="0.7"/>
  <!-- 중앙 다크 dot -->
  <circle cx="32" cy="32" r="7" fill="#0b1020"/>
</svg>
