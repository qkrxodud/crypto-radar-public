      - generic [ref=e29]: Cycle · Sentiment
      - heading "The Pi Cycle Top, in plain words" [level=1] [ref=e30]
      - paragraph [ref=e31]: The Pi Cycle Top watches two long-term moving averages — a fast 111-day line and a slow 350-day line doubled. When the fast line rises up to touch the doubled slow line, it has historically landed within days of a major cycle top. It only points at peaks, never bottoms, and three hits is a tiny sample — so read it as a "watch out" flag, not a mechanical sell button.
    - generic [ref=e32]:
      - generic [ref=e33]:
        - generic [ref=e34]: What it is
        - generic [ref=e35]: A crossover of the 111-day MA and twice the 350-day MA, used as a cycle-top warning.
      - generic [ref=e36]:
        - generic [ref=e37]: How to read
        - generic [ref=e38]: Fast crosses above = top warning. A caution flag, not a sell signal.
      - generic [ref=e39]:
        - generic [ref=e40]: Signal
        - generic [ref=e41]: Crossover = manage risk
    - generic [ref=e42]:
      - heading "1 What the Pi Cycle Top actually measures" [level=2] [ref=e43]:
        - generic [ref=e44]: "1"
        - generic [ref=e45]: What the Pi Cycle Top actually measures
      - paragraph [ref=e46]: "Most indicators try to value Bitcoin or gauge sentiment. The Pi Cycle Top does neither — it watches the distance between two long-term moving averages and treats the moment they meet as a milestone. The idea rests on a simple observation about momentum: near the blow-off end of a bull run, price accelerates so violently that even a slow trend line gets dragged steeply upward, until a faster average catches up to a much slower one."
      - paragraph [ref=e47]: In other words, the crossover isn't a magic prediction — it's a way of detecting that price has run far above its own long-term trend, very fast. That kind of stretch has historically appeared only at the frothy top of a cycle, which is why the touch of the two lines draws so much attention.
    - generic [ref=e48]:
      - heading "2 How it's calculated" [level=2] [ref=e49]:
        - generic [ref=e50]: "2"
        - generic [ref=e51]: How it's calculated
      - paragraph [ref=e52]: "The indicator plots two lines and watches for the moment they meet:"
      - list [ref=e53]:
        - listitem [ref=e54]:
          - text: Fast line — the
          - code [ref=e55]: 111-day moving average
          - text: of price.
        - listitem [ref=e56]:
          - text: Slow line — the
          - code [ref=e57]: 350-day moving average ×2
          - text: (the 350DMA doubled).
        - listitem [ref=e58]: The signal fires when the 111DMA rises up and crosses above the doubled 350DMA — the two lines touch.
      - paragraph [ref=e59]:
        - text: "The numbers themselves carry the name:"
        - code [ref=e60]: 350 ÷ 111 ≈ 3.153
        - text: ", which is close to the mathematical constant pi (π) — hence \"Pi Cycle.\" That ratio is a curiosity, not a law of markets; it works because it happens to capture the right kind of long-vs-short momentum stretch, not because of anything special about π."
    - generic [ref=e61]:
      - heading "3 Reading the signal" [level=2] [ref=e62]:
        - generic [ref=e63]: "3"
        - generic [ref=e64]: Reading the signal
      - paragraph [ref=e65]: Pi Cycle isn't a 0–100 scale, so instead of zones it has states. Read each state as a degree of caution, not a precise instruction.
      - generic [ref=e66]:
        - generic [ref=e67]:
          - generic [ref=e69]: Wide gap
          - generic [ref=e70]: The 111DMA sits far below the doubled 350DMA. Early to mid cycle — no top warning, the most relaxed state.
        - generic [ref=e71]:
          - generic [ref=e73]: Closing in
          - generic [ref=e74]: The fast line is climbing toward the slow line as price accelerates. A cue to start watching risk, not yet a warning.
        - generic [ref=e75]:
          - generic [ref=e77]: Crossover
          - generic [ref=e78]: The 111DMA touches/crosses above the doubled 350DMA — the classic top warning. Manage risk; don't chase.
        - generic [ref=e79]:
          - generic [ref=e81]: No bottom call
          - generic [ref=e82]: By design the indicator says nothing about bottoms — silence here is not a buy signal. Use other tools for lows.
    - generic [ref=e83]:
      - heading "4 Using it for timing" [level=2] [ref=e84]:
        - generic [ref=e85]: "4"
        - generic [ref=e86]: Using it for timing
      - paragraph [ref=e87]: Pi Cycle is a top-side risk filter, not an entry tool. When the crossover fires, the practical response isn't to dump everything — it's to stop chasing, trim if you're over-exposed, and tighten your risk plan, because history says the easy upside may be largely behind. When the two lines are far apart, the indicator simply isn't flashing a top warning, which frees you to lean on accumulation-side tools instead.
      - generic [ref=e88]:
        - generic [ref=e89]: Practical tip
        - paragraph [ref=e90]: Never act on the crossover alone. With only three past hits it's a coincidence-prone signal, and it has occasionally fired early. Confirm the broader picture with cycle and on-chain indicators, and remember it offers no help on the bottom side.
    - generic [ref=e91]:
      - heading "5 Limits & common misreadings" [level=2] [ref=e92]:
        - generic [ref=e93]: "5"
        - generic [ref=e94]: Limits & common misreadings
      - paragraph [ref=e95]: "The biggest caveat is sample size. The crossover has lined up with major tops only a handful of times, and three hits could simply be coincidence — past timing is no guarantee of future precision. It is also one-sided: it flags tops and stays mute on bottoms, so it should never be read as a buy signal when quiet. The most common mistake is turning it into a mechanical sell trigger — selling everything the day it crosses. In practice it has occasionally fired early, and markets can stay irrational longer than expected. Treat it as one cautionary input among many, weighted by how small its track record really is."
