    - generic [ref=e81]:
      - heading "4 Using it for buy timing" [level=2] [ref=e82]:
        - generic [ref=e83]: "4"
        - generic [ref=e84]: Using it for buy timing
      - paragraph [ref=e85]: "Hash rate works best as a long-term health check, not a timing trigger. A steadily rising trend reassures you that the network's foundation is strengthening, which can give patient buyers confidence that the asset they're accumulating isn't structurally decaying. The more interesting timing angle is the sharp drop: deep hash-rate declines reflect miner capitulation, and historically these have sometimes clustered near major price lows — though only in hindsight, and never as a precise signal on their own."
      - generic [ref=e86]:
        - generic [ref=e87]: Practical tip
        - paragraph [ref=e88]: Don't react to daily wiggles — they're noise from block-timing luck. For capitulation reads, pair hash rate with the Hash Ribbon, and remember it reflects security, not near-term price.
    - generic [ref=e89]:
      - heading "5 Limits & common misreadings" [level=2] [ref=e90]:
        - generic [ref=e91]: "5"
        - generic [ref=e92]: Limits & common misreadings
      - paragraph [ref=e93]: "Because hash rate is estimated from how fast blocks are found, it swings with the random luck of block timing — so short-term wiggles are noise, not signal. The most common mistake is treating it as a price predictor: a rising hash rate confirms the network is secure and miners are committed, but it has only a loose, lagging link to what price does next, and rising power has coincided with both rallies and declines. It also says nothing about valuation or sentiment. Read it as a structural health and security gauge — reassuring context for the long term — and pair it with the Hash Ribbon when you want to judge miner capitulation, rather than expecting it to time entries on its own."
