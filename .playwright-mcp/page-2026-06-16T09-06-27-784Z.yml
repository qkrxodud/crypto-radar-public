    - generic [ref=e42]:
      - heading "1 What hash rate actually measures" [level=2] [ref=e43]:
        - generic [ref=e44]: "1"
        - generic [ref=e45]: What hash rate actually measures
      - paragraph [ref=e46]: Price tells you what the market did. Hash rate tells you how much real-world effort is being spent to defend the network. Bitcoin miners run specialized machines that make trillions of guesses per second, competing to add the next block. The combined speed of all that guessing is the hash rate. Because running those machines costs real electricity and hardware, a high hash rate means a lot of capital is committed to keeping Bitcoin secure.
      - paragraph [ref=e47]: The intuition is that miners are long-term participants who don't switch on expensive equipment unless they expect the network to keep running and have value. So a steadily rising hash rate reflects growing, capital-backed conviction in Bitcoin's survival — even if that has only a loose, lagging connection to short-term price.
    - generic [ref=e48]:
      - heading "2 How it's estimated" [level=2] [ref=e49]:
        - generic [ref=e50]: "2"
        - generic [ref=e51]: How it's estimated
      - paragraph [ref=e52]: "Hash rate isn't measured directly — it's inferred. No one can count every machine, so the figure is reverse-engineered from on-chain facts:"
      - list [ref=e53]:
        - listitem [ref=e54]: Block speed — how quickly new blocks are being found. Faster than the ~10-minute target implies more power is online.
        - listitem [ref=e55]: Mining difficulty — the network auto-adjusts how hard the puzzle is roughly every two weeks to keep block times near 10 minutes.
        - listitem [ref=e56]:
          - text: The combined estimate — putting those together gives an approximate number of
          - code [ref=e57]: hashes per second
          - text: across all miners.
      - paragraph [ref=e58]: "The takeaway: because it's an estimate tied to the luck of block timing, the day-to-day number wobbles. What's meaningful is the smoothed trend over weeks and months, not any single reading."
    - generic [ref=e59]:
      - heading "3 Reading the trend" [level=2] [ref=e60]:
        - generic [ref=e61]: "3"
        - generic [ref=e62]: Reading the trend
      - paragraph [ref=e63]: There's no buy/sell line — hash rate is about direction and structural health, not a threshold. Read the smoothed trend.
