      - generic [ref=e29]: On-Chain
      - heading "Hash rate, in plain words" [level=1] [ref=e30]
      - paragraph [ref=e31]: Hash rate is the total computing power that miners around the world devote to securing the Bitcoin network. The more power is pointed at the network, the harder it is to attack and the healthier it is. It doesn't tell you what Bitcoin is worth — it tells you how much real-world energy and money miners are willing to commit, which is a slow but honest gauge of long-term confidence.
