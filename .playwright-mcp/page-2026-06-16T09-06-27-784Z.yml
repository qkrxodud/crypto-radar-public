      - generic [ref=e33]:
        - generic [ref=e34]: What it is
        - generic [ref=e35]: The total computing power miners devote to the network.
      - generic [ref=e36]:
        - generic [ref=e37]: How to read
        - generic [ref=e38]: Rising trend = a healthy, secure network. It's a long-term confidence gauge.
      - generic [ref=e39]:
