    - generic [ref=e81]:
      - heading "4 Using it for buy timing" [level=2] [ref=e82]:
        - generic [ref=e83]: "4"
        - generic [ref=e84]: Using it for buy timing
      - paragraph [ref=e85]: Treat the S&P 500 as a background filter rather than a trigger. When equities are in a healthy uptrend, the macro wind is at Bitcoin's back, and accumulation plans tend to face less headwind. When stocks are in a violent selloff, it's a reminder that crypto can get swept up in cross-asset deleveraging regardless of its own fundamentals — a cue to size positions carefully rather than to buy or sell on the equity move alone.
      - generic [ref=e86]:
        - generic [ref=e87]: Practical tip
        - paragraph [ref=e88]: Don't assume the link is fixed. Look at the rolling correlation between Bitcoin and the S&P 500 — when it's high, macro matters more; when it's low, lean on Bitcoin's own indicators instead.
    - generic [ref=e89]:
      - heading "5 Limits & common misreadings" [level=2] [ref=e90]:
        - generic [ref=e91]: "5"
        - generic [ref=e92]: Limits & common misreadings
      - paragraph [ref=e93]: The biggest mistake is assuming the correlation is constant. It strengthens in panics — when liquidity dries up, investors sell whatever they can, and Bitcoin trades like a high-beta risk asset alongside stocks. But it weakens in calm periods, when Bitcoin follows its own halving cycle and on-chain dynamics and can drift far from equities. Treating the S&P 500 as a permanent leading indicator for Bitcoin sets you up to be wrong exactly when the relationship breaks. Check the rolling correlation rather than presuming it, and remember this is a macro context layer — not a substitute for Bitcoin-native signals.
