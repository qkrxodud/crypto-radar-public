      - generic [ref=e29]: Macro
      - heading "The S&P 500 and Bitcoin, in plain words" [level=1] [ref=e30]
      - paragraph [ref=e31]: The S&P 500 is the benchmark US stock index, and it doubles as a thermometer for global risk appetite. When stocks are rising, investors are comfortable taking on risk — a backdrop that has often been favorable for Bitcoin too. When equities sell off hard, that same risk-off mood has frequently dragged crypto down with it. We watch its trend, not its exact level.
    - generic [ref=e32]:
      - generic [ref=e33]:
        - generic [ref=e34]: What it is
        - generic [ref=e35]: The benchmark US stock index and a proxy for global risk appetite.
      - generic [ref=e36]:
        - generic [ref=e37]: How to read
        - generic [ref=e38]: Directional — strength = risk-on, sharp drops = risk-off.
      - generic [ref=e39]:
        - generic [ref=e40]: Signal
        - generic [ref=e41]: Strength = risk-on backdrop
    - generic [ref=e42]:
      - heading "1 What the S&P 500 tells you about Bitcoin" [level=2] [ref=e43]:
        - generic [ref=e44]: "1"
        - generic [ref=e45]: What the S&P 500 tells you about Bitcoin
      - paragraph [ref=e46]: "On its own, the S&P 500 says nothing about Bitcoin's supply, on-chain activity, or cycle. What it captures is the weather that all risk assets share: the collective willingness of investors to put money into things that can swing hard. Bitcoin is one of the riskiest assets in a typical portfolio, so it tends to thrive when that willingness is high and struggle when it evaporates."
      - paragraph [ref=e47]: "This is why the S&P 500 belongs in a Bitcoin dashboard at all. It's a macro context filter: it doesn't tell you when to buy, but it tells you whether the broader environment is leaning toward putting money into risk (risk-on) or pulling it out (risk-off)."
    - generic [ref=e48]:
      - heading "2 What the index is and how we read it" [level=2] [ref=e49]:
        - generic [ref=e50]: "2"
        - generic [ref=e51]: What the index is and how we read it
      - paragraph [ref=e52]: "The mechanics are simple, and unlike on-chain metrics there's no threshold to memorize — the read is directional:"
      - list [ref=e53]:
        - listitem [ref=e54]: Composition — a market-cap-weighted index of 500 large US companies, so bigger firms move it more.
        - listitem [ref=e55]: What it stands for — the standard benchmark for the US stock market and a widely used proxy for global risk appetite.
        - listitem [ref=e56]: No buy/sell line — there's no fixed threshold. A rising trend signals risk-on; sharp selloffs signal risk-off.
        - listitem [ref=e57]: What we track — the trend and its correlation with Bitcoin, not the absolute point value.
      - paragraph [ref=e58]: The takeaway is that the S&P 500 is read as a direction and a relationship, not as a number you cross above or below. A market grinding to new highs and one bleeding lower send very different messages about the risk backdrop around Bitcoin.
    - generic [ref=e59]:
