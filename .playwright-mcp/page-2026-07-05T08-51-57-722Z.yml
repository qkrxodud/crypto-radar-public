      - generic [ref=f6e57]:
        - generic [ref=f6e60]: Cycle · Sentiment
        - heading "The MVRV-Z Score, explained in plain terms" [level=1] [ref=f6e61]
        - paragraph [ref=f6e62]: The MVRV-Z Score compares Bitcoin's market price with the average price holders actually paid. When price runs far above that cost basis, the market looks stretched; when it falls below, it looks washed out to the bottom. It is one of the cleaner long-term gauges for judging overvaluation and undervaluation.
      - generic [ref=f6e63]:
        - generic [ref=f6e64]:
          - generic [ref=f6e65]: What it is
          - generic [ref=f6e66]: Price compared with the market's average cost basis, adjusted for volatility.
        - generic [ref=f6e67]:
          - generic [ref=f6e68]: How to read it
          - generic [ref=f6e69]: Above 7 is a top zone, below 0 is a bottom zone.
        - generic [ref=f6e70]:
          - generic [ref=f6e71]: Signal
          - generic [ref=f6e72]: Higher = more overheated
      - generic [ref=f6e73]:
        - heading "1 What the MVRV-Z Score measures" [level=2] [ref=f6e74]:
          - generic [ref=f6e75]: "1"
          - generic [ref=f6e76]: What the MVRV-Z Score measures
        - paragraph [ref=f6e77]: Price alone cannot tell you whether Bitcoin is 'expensive.' Expensive compared with what? The MVRV-Z Score answers this by using the market's own purchase history as a yardstick — how far today's price sits above or below what holders paid on average. When that gap is wide, later buyers are sitting on large paper gains and the market tends to overheat; when the gap narrows or turns negative, a large share of the market is in a loss.
        - paragraph [ref=f6e78]: The 'Z' in the name means the gap is rescaled by volatility. So the value is not distorted simply because Bitcoin is larger today than it was years ago. The result is a single number that has fit remarkably well across cycles, which is why it is read as a long-term valuation gauge rather than a daily signal.
      - generic [ref=f6e79]:
        - heading "2 How it is calculated" [level=2] [ref=f6e80]:
          - generic [ref=f6e81]: "2"
          - generic [ref=f6e82]: How it is calculated
        - paragraph [ref=f6e83]: This score is built from three pieces. You do not need to calculate it yourself — the point is to understand what each piece means.
        - list [ref=f6e84]:
          - listitem [ref=f6e85]: Market cap — current price × circulating supply, that is, today's surface-level value.
          - listitem [ref=f6e86]: Realized cap — each coin valued at the price it last moved, then summed. This is close to the market's overall average cost basis.
          - listitem [ref=f6e87]: Standard deviation (σ) — the standard deviation of market cap, which normalizes the gap so cycles can be compared.
        - paragraph [ref=f6e88]:
          - text: Put together,
          - code [ref=f6e89]: MVRV-Z = (market cap − realized cap) ÷ σ
          - text: . In words — it measures how far today's value sits above the market's average cost basis, then adjusts for how volatile the market has been. A large positive value means price is well above cost basis; near 0 or below means it is not.
      - generic [ref=f6e90]:
        - heading "3 Reading it by range" [level=2] [ref=f6e91]:
          - generic [ref=f6e92]: "3"
          - generic [ref=f6e93]: Reading it by range
        - paragraph [ref=f6e94]: The score is loosely divided into ranges drawn from past cycles. Treat the numbers as soft historical markers, not precise triggers.
        - generic [ref=f6e95]:
          - generic [ref=f6e96]:
            - generic [ref=f6e98]: Below 0
            - generic [ref=f6e99]: Bottom zone. Price is below the market's average cost basis — a large share of the market is in a loss. Historically rare and overlapping with long-term lows.
          - generic [ref=f6e100]:
            - generic [ref=f6e102]: 0–2
            - generic [ref=f6e103]: Undervalued side. Price is slightly above cost basis. Often the backdrop for early-cycle accumulation by patient buyers.
          - generic [ref=f6e104]:
            - generic [ref=f6e106]: 2–4
            - generic [ref=f6e107]: Mid-cycle. Broadly neutral territory. The trend may run further, but the most undervalued entry zone has passed.
          - generic [ref=f6e108]:
            - generic [ref=f6e110]: Above 7
            - generic [ref=f6e111]: "Top zone. Price is well above cost basis — historically an overheating warning. Note: the peak values have trended lower with each cycle."
      - generic [ref=f6e112]:
        - heading "4 How to use it for buy timing" [level=2] [ref=f6e113]:
          - generic [ref=f6e114]: "4"
          - generic [ref=f6e115]: How to use it for buy timing
        - paragraph [ref=f6e116]: MVRV-Z is a valuation backdrop, not a trigger. Low or negative values suggest the market has been washed out to the bottom, which can add conviction to a dollar-cost-averaging (DCA) plan; very high values suggest the market is stretched, a signal to slow aggressive buying and review risk. Because it moves slowly, it answers 'where are we in the cycle' far better than 'should I buy this week.'
        - generic [ref=f6e117]:
          - generic [ref=f6e118]: In practice
          - paragraph [ref=f6e119]: Do not expect it to pinpoint exact tops and bottoms. Because peak values have fallen each cycle, a fixed rule like 'sell at 7' can mislead. Read MVRV-Z together with cycle position and sentiment, and use it to size your plan rather than to pick an exact date.
      - generic [ref=f6e120]:
        - heading "5 Limitations and common misconceptions" [level=2] [ref=f6e121]:
          - generic [ref=f6e122]: "5"
          - generic [ref=f6e123]: Limitations and common misconceptions
        - paragraph [ref=f6e124]: The thresholds are calibrated on past cycles, and as the market has matured the peaks have trended lower each cycle — the level that screamed 'top' in 2017 may not return. The biggest misconception is using it as a short-term timing tool — it updates slowly and is nearly useless for day- or week-scale trading. It can also sit in one range for months without resolving. And like every valuation gauge, it describes a state rather than a catalyst — it tells you whether the market is stretched or washed out, but not when that will change. Use it as slow-moving context and cross-check it with faster indicators.
