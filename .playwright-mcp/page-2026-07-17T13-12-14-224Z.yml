          - heading "여러 지표를 함께 읽는 이유" [level=3] [ref=f6e488]
          - paragraph [ref=f6e489]: 어떤 단 하나의 숫자도 바닥이나 천장을 짚어주지 못합니다. RSI(최근 상승·하락의 힘을 0~100으로 나타낸 값)는 하락장에서 몇 주씩 과매도로 깜빡일 수 있고, 펀딩비(선물에서 어느 쪽이 비용을 더 내는지)는 마이너스가 되고도 더 떨어지곤 하며, ETF 순유입이 플러스라고 그 자체로 상승이 보장되지도 않습니다. 지표 하나는 시장의 한 단면만 담기 때문에, 한 개에만 기대는 건 온도계 하나로 날씨 전체를 판단하는 것과 비슷합니다.
          - paragraph [ref=f6e490]: 그래서 사이클·심리, 기술적 분석, 파생상품, 온체인, 매크로라는 다섯 카테고리로 나눠 교차로 읽습니다. 이들은 서로 다른 층위를 봅니다 — 사이클·심리는 느리고 구조적인 배경을, 기술적 분석은 최근 가격 움직임을, 파생상품은 레버리지 투자자들의 포지션 쏠림을, 온체인은 실제 코인 보유자들의 행동을, 매크로는 넓은 위험자산 환경 속 비트코인의 위치를 나타냅니다. 여러 카테고리가 한 방향을 동시에 가리킬 때, 그 신호는 어느 하나만 볼 때보다 훨씬 믿을 만합니다.
          - paragraph [ref=f6e491]: 신호는 자주 서로 엇갈립니다 — 한 카테고리는 공포를, 다른 카테고리는 과열을 말하기도 합니다. 이건 결함이 아니라 쓸모 있는 정보입니다. 대개 시장이 어느 방향으로도 뚜렷한 우위가 없다는 뜻이고, 중립 구간은 바로 그런 상태를 묘사하려고 존재합니다. 억지로 하나의 답을 만들기보다, 신호가 상충할 때는 더 천천히·분할해서 접근할 이유로 받아들이는 편이 낫습니다.
          - heading "점수는 어떻게 나오나요 — 세 단계" [level=3] [ref=f6e492]
          - paragraph [ref=f6e493]:
            - text: ① 0~100으로 정규화. 지표마다 단위가 제각각입니다 — RSI는 0~100, 펀딩비는 아주 작은 %, DXY(달러가 주요 통화 대비 얼마나 강한지)는 100 부근의 지수입니다. 이를 그대로 비교하는 건 의미가 없어, 각 지표를 공통의
            - code [ref=f6e494]: 0~100
            - text: 척도로 변환합니다. 범위가 정해진 지표는 알려진 구간을 매핑하고, 범위가 열린 지표는 그 지표 자신의 최근 역사에 견줘 — 고정선이 아니라 평소 대비 위치로 — 점수화합니다.
          - paragraph [ref=f6e495]:
            - text: ② 카테고리 가중치 적용·합산. 다섯 카테고리는 동등하지 않습니다. 느리고 구조적인 신호에 간접적 신호보다 큰 비중을 둬
            - code [ref=f6e496]: 30 / 25 / 20 / 15 / 10%
            - text: 입니다. 각 카테고리는 소속 지표를 먼저 평균낸 뒤, 그 가중치를 곱해 더합니다. 예를 들어 정규화된 카테고리 점수가 사이클 30, 기술 40, 파생 50, 온체인 35, 매크로 60이라면 종합 점수는
            - code [ref=f6e497]: 30×0.30 + 40×0.25 + 50×0.20 + 35×0.15 + 60×0.10 = 40.25
            - text: 가 됩니다. 이렇게 하면 한 지표가 결과를 지배하지 못합니다.
          - paragraph [ref=f6e498]: ③ 구간으로 해석. 최종 0~100 점수를 공포·중립·탐욕 구간으로 읽습니다. 점수가 낮으면 공포가 퍼진 상태로 역사적으로 장기 매수 구간에 더 가까웠고, 높으면 탐욕과 과열로 주의가 필요한 때입니다. 경계는 약속이 아니라 이정표입니다 — 낮은 점수는 통계적으로 우호적이었던 배경을 묘사할 뿐, 상승을 결코 보장하지 않습니다.
