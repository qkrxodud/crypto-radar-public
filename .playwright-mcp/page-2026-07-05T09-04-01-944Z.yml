        - generic [ref=f18e60]: Cycle · Sentiment
        - heading "NUPL, explained in plain terms" [level=1] [ref=f18e61]
        - paragraph [ref=f18e62]: NUPL (Net Unrealized Profit/Loss) answers a single question. On average, are the people holding Bitcoin sitting on paper gains right now, or on losses? It compares each coin's value today with the price at which it last moved, then expresses that gap as a ratio of total value. When these paper gains grow large, holders are tempted to sell; when it turns negative, the market is in pain — and that pain has often marked bottoms.
      - generic [ref=f18e63]:
        - generic [ref=f18e64]:
          - generic [ref=f18e65]: What it is
          - generic [ref=f18e66]: The share of all holders' unrealized (paper) profit within the total value.
        - generic [ref=f18e67]:
          - generic [ref=f18e68]: How to read it
          - generic [ref=f18e69]: Below 0 = capitulation — historically a better buying zone; very high means greed.
        - generic [ref=f18e70]:
          - generic [ref=f18e71]: Signal
          - generic [ref=f18e72]: More negative = buying opportunity
      - generic [ref=f18e73]:
        - heading "1 What NUPL measures" [level=2] [ref=f18e74]:
          - generic [ref=f18e75]: "1"
          - generic [ref=f18e76]: What NUPL measures
        - paragraph [ref=f18e77]: Price alone tells you only the current quote, not whether the average holder is content or in pain. NUPL fills that gap. It looks at every coin, compares its current value with the price at which it last moved on-chain, and sums that difference across the whole network. The result is a single ratio that captures the market's collective emotional state — wide gains mean comfort, vanishing gains mean stress.
        - paragraph [ref=f18e78]: The intuition is behavioral. When most coins sit on deep gains, the temptation to lock in profit grows and selling pressure builds in the market. When most coins are underwater, those who were going to sell have already given up, and as supply tightens the conditions for a bottom quietly form. NUPL turns that crowd psychology into a number you can track over time.
      - generic [ref=f18e79]:
        - heading "2 How it is calculated" [level=2] [ref=f18e80]:
          - generic [ref=f18e81]: "2"
          - generic [ref=f18e82]: How it is calculated
        - paragraph [ref=f18e83]: NUPL is built from two on-chain numbers. Market cap values every coin at today's price. Realized cap values every coin at the price it last moved — a rough proxy for the network's average cost basis. The formula is simple.
        - list [ref=f18e84]:
          - listitem [ref=f18e85]:
            - text: NUPL =
            - code [ref=f18e86]: (market cap − realized cap) ÷ market cap
          - listitem [ref=f18e87]: "The numerator is total unrealized profit/loss: how much paper gain (or loss) the whole market is holding."
          - listitem [ref=f18e88]: Dividing by market cap rescales it into a comparable ratio, so you can compare today's value with past cycles regardless of the price level.
        - paragraph [ref=f18e89]: When NUPL is positive, the market is in net profit; when it is negative, the average coin is underwater. You do not need to compute it yourself. The key is that this is not a price forecast but a cost-basis comparison in the same family as MVRV.
      - generic [ref=f18e90]:
        - heading "3 Reading it by range" [level=2] [ref=f18e91]:
          - generic [ref=f18e92]: "3"
          - generic [ref=f18e93]: Reading it by range
        - paragraph [ref=f18e94]: NUPL is traditionally divided into emotion zones. Treat the boundaries as gradual shifts, not sharp lines — the same value can mean different things early versus late in a cycle.
        - generic [ref=f18e95]:
          - generic [ref=f18e96]:
            - generic [ref=f18e98]: Below 0
            - generic [ref=f18e99]: Capitulation. The average holder is at a loss. Historically the best zone for long-term entry — though it can persist for a while.
          - generic [ref=f18e100]:
            - generic [ref=f18e102]: 0 – 0.25
            - generic [ref=f18e103]: Hope / fear. Small net gains are returning. Often a reasonable zone for patient buyers to accumulate gradually.
          - generic [ref=f18e104]:
            - generic [ref=f18e106]: 0.25 – 0.5
            - generic [ref=f18e107]: Optimism. Gains are at a comfortable level. Momentum may run further, but the easy entry zone has passed.
          - generic [ref=f18e108]:
            - generic [ref=f18e110]: 0.5 – 0.75
            - generic [ref=f18e111]: Belief. Wide paper gains raise selling pressure. It is wise to lower expectations of easy upside.
          - generic [ref=f18e112]:
            - generic [ref=f18e114]: Above 0.75
            - generic [ref=f18e115]: Euphoria. Near the top range. A warning to manage risk and avoid chasing — not a precise sell signal.
      - generic [ref=f18e116]:
        - heading "4 How to use it for buy timing" [level=2] [ref=f18e117]:
          - generic [ref=f18e118]: "4"
          - generic [ref=f18e119]: How to use it for buy timing
        - paragraph [ref=f18e120]: NUPL works best as a context filter rather than a trigger. When it drops into the capitulation zone below 0, it signals that the average holder is in pain and that long-term entries have historically clustered around here — a moment to lean toward a phased (DCA) approach rather than waiting for the exact bottom. When it climbs into the euphoria zone above 0.75, it is a signal to stop buying aggressively and check the risk you are carrying.
        - generic [ref=f18e121]:
          - generic [ref=f18e122]: Practical tip
          - paragraph [ref=f18e123]: Don't react to a single day's value. Unrealized profit is pressure, not actual selling, so NUPL can stay high for a long time before a correction. Watch whether the index stays in one zone for weeks, and judge it alongside price and other on-chain indicators before committing capital.
      - generic [ref=f18e124]:
        - heading "5 Limits and common misreadings" [level=2] [ref=f18e125]:
          - generic [ref=f18e126]: "5"
          - generic [ref=f18e127]: Limits and common misreadings
        - paragraph [ref=f18e128]: "NUPL measures pressure, not behavior. A wide unrealized profit only means holders could sell, not that they will — so it can sit in the euphoria zone for weeks while price keeps rising, and stay negative through a long, grinding bottom. The most common mistake is reading negative NUPL as an automatic buy and euphoria as an automatic sell. The second trap is double counting: NUPL shares inputs with the MVRV-Z Score, so even when both agree they are not really two independent signals but one idea seen twice."
