        - paragraph [ref=f18e78]: DXY는 하나의 질문에 답하는 단일 숫자입니다 — 미국 달러가 다른 주요 통화 대비 강해지고 있는가, 약해지고 있는가? 달러로 예전보다 더 많은 유로·엔·파운드를 살 수 있으면 지수가 오르고, 더 적게 사면 내립니다. 비트코인에 대해 직접 말하는 것은 없습니다 — 재는 대상은 달러입니다.
        - paragraph [ref=f18e79]: 비트코인 대시보드가 왜 통화 지수에 신경 쓸까요? 달러가 전 세계의 기축통화이자 위험이 매겨지는 단위이기 때문입니다. 달러가 강할 때는 글로벌 유동성이 조여지고 달러 차입 비용이 비싸지며, 자금이 투기적 자산에서 현금의 안전으로 흘러가는 경향이 있습니다. 달러가 약할 때는 반대로 유동성이 풀리고 자본이 더 높은 수익을 찾는데, 역사적으로 거기에 비트코인도 포함됐습니다.
