      - generic [ref=f18e114]:
        - heading "4 매수 타이밍에 쓰는 법" [level=2] [ref=f18e115]:
          - generic [ref=f18e116]: "4"
          - generic [ref=f18e117]: 매수 타이밍에 쓰는 법
        - paragraph [ref=f18e118]: DXY는 매일 반응하는 트리거가 아니라 느린 배경 변수입니다. 가장 좋은 쓰임새는 점검용입니다 — 건설적인 온체인·기술적 셋업이 보일 때, 달러가 순풍(하락)인지 당신과 맞서는지(상승)를 한 번 봐 두세요. 달러가 가파르게 오르는데 나타난 유호적 비트코인 셋업은 더 조심할 가치가 있고, 같은 셋업이 약달러와 함께라면 등 뒤에 바람이 더 붑니다.
        - generic [ref=f18e119]:
          - generic [ref=f18e120]: 실전 팁
          - paragraph [ref=f18e121]: DXY의 순간 변동에 매매하지 마세요. 몇 주 추세를 보고 연준의 정책 방향과 함께 보세요 — DXY는 금리 인상 기대(달러 상승)나 인하 기대(달러 하락)와 함께 움직이는 경우가 많습니다. 환경을 규정하는 것은 DXY, 타이밍은 온체인·파생 지표의 몫입니다.
      - generic [ref=f18e122]:
