          - generic [ref=f18e83]: 어떻게 계산되나
        - paragraph [ref=f18e84]: DXY는 달러의 6개 통화 대비 환율을 가중 기하평균한 값입니다. 가중치는 수십 년 전에 정해진 고정값이라 유로의 비중이 압도적으로 큽니다.
        - list [ref=f18e85]:
          - listitem [ref=f18e86]: 유로 (EUR, ~57.6%) — 압도적으로 가장 큰 비중이라, DXY는 사실상 달러 대 유로 이야기에 가깝습니다.
          - listitem [ref=f18e87]: 일본 엔 (JPY, ~13.6%) — 두 번째로 큰 비중.
          - listitem [ref=f18e88]: 영국 파운드 (GBP, ~11.9%), 캐나다 달러 (CAD, ~9.1%).
          - listitem [ref=f18e89]: 스웨덴 크로나 (SEK, ~4.2%), 스위스 프랑 (CHF, ~3.6%) — 가장 작은 조각들.
        - paragraph [ref=f18e90]:
          - text: 직접 계산할 필요는 없습니다 — 값은 어디서나 단일 지수 수준(흔히
          - code [ref=f18e91]: "100"
          - text: 부근)으로 인용됩니다. 핵심은 DXY가 한국 원, 중국 위안, 대부분의 신흥국 통화를 포함하지 않는다는 점입니다. 그래서 '선진국 기준 달러 강세' 잣대이지, 모든 통화에 대한 달러 가치를 그대로 재는 것은 아닙니다.
