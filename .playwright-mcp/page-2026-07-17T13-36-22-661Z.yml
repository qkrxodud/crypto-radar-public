        - paragraph [ref=f18e126]: 달러와 비트코인의 역상관은 느슨한 경향일 뿐 법칙이 아니며, 한동안 깨지기도 합니다 — 둘이 함께 오르거나 함께 내린 시기도 있었습니다. 가장 흔한 실수는 DXY를 정밀한 타이밍 신호로 다루는 것입니다. 이것은 간접적이고 느린 거시 영향이라, 하루치 작은 출렁임에 반응하는 건 잡음일 뿐입니다. 또 원·위안을 포함하지 않아 신흥국 대비 달러 강세를 담지 못하고, 환시장은 암호화폐와 무관한 이유(유럽 위기, 엔 개입)로도 움직일 수 있습니다.
      - generic [ref=f18e127]:
        - heading "6 실전 사례 · 계산 예시" [level=2] [ref=f18e128]:
          - generic [ref=f18e129]: "6"
          - generic [ref=f18e130]: 실전 사례 · 계산 예시
        - generic [ref=f18e131]:
          - generic [ref=f18e132]: 계산 예시
          - paragraph [ref=f18e133]: DXY가 95에서 105로 올랐다고 가정해봅시다. 이는 대략 +10.5%의 달러 강세((105−95)÷95×100)입니다. DXY 자체는 유로·엔·파운드 등 6개 통화 대비 달러를 가중 평균한 지수라, 비트코인 가격을 직접 나타내지는 않습니다. 대신 배경으로 읽습니다 — 같은 기간 달러가 강해지면 비트코인 같은 위험자산이 눌리는 경향이 있습니다. 만약 그 10% 달러 강세 구간에 BTC가 약 $45,000에서 $40,000 부근으로 밀렸다면, 둘이 반대로 움직인 이 모습이 바로 역상관 패턴입니다. 여기 숫자는 예시일 뿐 실제 관측값이 아닙니다.
        - paragraph [ref=f18e134]: 뚜렷한 실제 사례는 2022년입니다. 그해 연준이 공격적으로 금리를 올리며 달러가 급등했고, DXY는 가을 무렵 수십 년 만의 고점 부근까지 올랐습니다. 같은 기간 비트코인은 연초 약 $47,000에서 11월 FTX 붕괴 무렵 약 $15,500까지 가파르게 떨어졌습니다. 달러 혼자 비트코인을 끌어내린 것은 아니지만, 강달러·긴축 유동성이라는 배경이 광범위한 위험 회피 흐름과 맞물렸습니다. 이 국면은 DXY가 정밀한 진입 신호라기보다 느린 거시 순풍·역풍으로 관찰되는 이유를 보여줍니다.
