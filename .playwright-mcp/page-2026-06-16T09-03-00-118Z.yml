        - generic [ref=e34]: What it is
        - generic [ref=e35]: How wide price has been swinging over a recent window.
      - generic [ref=e36]:
        - generic [ref=e37]: How to read
        - generic [ref=e38]: Tight compression often precedes a big move — direction unknown.
      - generic [ref=e39]:
        - generic [ref=e40]: Signal
        - generic [ref=e41]: Compression = big move ahead
    - generic [ref=e42]:
      - heading "1 What historical volatility actually measures" [level=2] [ref=e43]:
        - generic [ref=e44]: "1"
        - generic [ref=e45]: What historical volatility actually measures
      - paragraph [ref=e46]: Most indicators try to tell you where price is going. Historical volatility doesn't — it tells you how energetic the market currently is. A calm market drifts in small daily steps; an energetic one lurches in big ones. By measuring the typical size of those daily steps, volatility captures the market's 'temperature' independent of direction.
      - paragraph [ref=e47]: "The reason it matters for timing is a well-known market rhythm: volatility tends to cluster and cycle. Quiet periods of tight, low volatility don't last forever — they coil up energy that eventually releases as a sharp move, and violent periods eventually exhaust themselves back into calm. Reading where volatility sits in that cycle is reading whether the market is winding up or winding down."
    - generic [ref=e48]:
      - heading "2 How it's calculated" [level=2] [ref=e49]:
        - generic [ref=e50]: "2"
        - generic [ref=e51]: How it's calculated
      - paragraph [ref=e52]: "The recipe is three steps over a chosen window (commonly 30 days):"
      - list [ref=e53]:
        - listitem [ref=e54]: Daily returns. Take the day-to-day percentage change in price across the window.
        - listitem [ref=e55]: Standard deviation. Compute how scattered those daily returns are around their average — a wide scatter means big, unpredictable swings; a narrow one means calm.
        - listitem [ref=e56]: Annualize. Scale the daily figure up to a yearly basis so readings are comparable across periods. The final number is usually quoted as an annualized percentage.
      - paragraph [ref=e57]: "The takeaway: a larger number means wider daily swings, a smaller number means calm. The exact figure matters less than where it sits relative to Bitcoin's own recent range — which is why this is a relative, not an absolute, reading."
    - generic [ref=e58]:
      - heading "3 Reading the levels" [level=2] [ref=e59]:
        - generic [ref=e60]: "3"
        - generic [ref=e61]: Reading the levels
      - paragraph [ref=e62]: There is no fixed cutoff — what matters is the level relative to its own recent range. Treat these as gradients, not hard lines.
