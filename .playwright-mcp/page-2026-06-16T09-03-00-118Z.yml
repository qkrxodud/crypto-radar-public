    - generic [ref=e80]:
      - heading "4 Using it for buy timing" [level=2] [ref=e81]:
        - generic [ref=e82]: "4"
        - generic [ref=e83]: Using it for buy timing
      - paragraph [ref=e84]: "Because it says nothing about direction, historical volatility works best as a preparation tool, not an entry trigger. A multi-month low in volatility is a cue to get ready — to define your levels and decide in advance how you'll respond if price breaks up versus down — rather than to buy on the spot. It also informs sizing: when volatility is low, the same position carries less day-to-day risk; when it spikes, the same position can swing far harder, so trimming size is reasonable."
      - generic [ref=e85]:
        - generic [ref=e86]: Practical tip
        - paragraph [ref=e87]: Never read compression as a direction. When volatility is coiled tight, prepare for both a break up and a break down, and let other indicators — trend, on-chain flows, derivatives — point the way once the move begins.
    - generic [ref=e88]:
      - heading "5 Limits & common misreadings" [level=2] [ref=e89]:
        - generic [ref=e90]: "5"
        - generic [ref=e91]: Limits & common misreadings
      - paragraph [ref=e92]: "The two biggest limits are direction and timing. It tells you a big move may be near but says nothing about which way — the breakout can go either way, and acting on compression alone is a coin flip. It is also backward-looking: it measures volatility that has already happened, not what comes next, so a low reading is a statement about the recent past, not a guarantee about the future. Two further traps: compression can persist far longer than feels comfortable before anything happens, and a single 'big move' it predicts can itself be a fake-out that reverses. Use it to gauge whether the market is coiled or stretched, never as a standalone buy or sell signal."
