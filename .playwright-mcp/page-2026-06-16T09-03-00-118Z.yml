      - generic [ref=e29]: Technical Analysis
      - heading "Historical volatility, in plain words" [level=1] [ref=e30]
      - paragraph [ref=e31]: "Historical volatility measures how violently the price has been swinging over a recent window — not which way it moved, just how much. Its real value isn't in the high readings but in the quiet ones: when volatility compresses to a tight, calm level, a large move has often followed soon after. The direction stays undetermined — only the size of what's coming is hinted at."
    - generic [ref=e32]:
