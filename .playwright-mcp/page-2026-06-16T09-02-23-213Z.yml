      - heading "The halving cycle, in plain words" [level=1] [ref=e30]
      - paragraph [ref=e31]: About every four years, the amount of new Bitcoin created is cut in half. This event — the halving — has anchored a roughly four-year rhythm in which the market has tended to climb, peak, and reset. It doesn't predict a price, but it tells you where in the cycle you might be standing.
    - generic [ref=e32]:
      - generic [ref=e33]:
        - generic [ref=e34]: What it is
        - generic [ref=e35]: A ~4-year supply-driven rhythm anchored to the halving event.
      - generic [ref=e36]:
        - generic [ref=e37]: How to read
        - generic [ref=e38]: The 12–18 months after a halving have historically been the uptrend phase.
      - generic [ref=e39]:
        - generic [ref=e40]: Signal
        - generic [ref=e41]: Depends on cycle position
    - generic [ref=e42]:
      - heading "1 What the halving cycle actually measures" [level=2] [ref=e43]:
        - generic [ref=e44]: "1"
        - generic [ref=e45]: What the halving cycle actually measures
      - paragraph [ref=e46]: "Most indicators describe the market right now. The halving cycle is different: it places today on a long timeline that repeats roughly every four years. Instead of asking 'is the market cheap or expensive,' it asks 'how far are we from the last supply shock, and where did that point sit in past cycles?'"
      - paragraph [ref=e47]: The reasoning is supply-based. Bitcoin's issuance schedule is fixed in code, and each halving cuts the flow of newly mined coins in half. If demand holds steady or grows while new supply slows, that imbalance has, in past cycles, coincided with rising prices over the following year or so. The cycle indicator is simply a way to track days since the last halving and compare that position to history.
    - generic [ref=e48]:
      - heading "2 How it's calculated" [level=2] [ref=e49]:
        - generic [ref=e50]: "2"
        - generic [ref=e51]: How it's calculated
      - paragraph [ref=e52]:
        - text: The halving itself is not a forecast — it's a hard rule written into the protocol. Every
        - code [ref=e53]: 210,000
        - text: "blocks (roughly four years), the block reward paid to miners is cut in half. From that fixed schedule we can derive a clean timeline:"
      - list [ref=e54]:
        - listitem [ref=e55]: Block reward halves — the new-coin issuance rate drops 50% at each event.
        - listitem [ref=e56]: Days since the last halving — the core counter that places the market on the cycle.
        - listitem [ref=e57]: Comparison to prior cycles — the same day-count from 2012, 2016, and 2020 is overlaid for context.
      - paragraph [ref=e58]: The most recent (fourth) halving occurred in April 2024. Because the schedule is mechanical, the timeline part is exact; only the price pattern layered on top of it is uncertain. Keep those two things separate in your head.
    - generic [ref=e59]:
      - heading "3 Reading the phases" [level=2] [ref=e60]:
        - generic [ref=e61]: "3"
        - generic [ref=e62]: Reading the phases
      - paragraph [ref=e63]: A cycle is often described in four loose phases relative to the halving. Treat them as a rough narrative observed in past cycles, not a guaranteed schedule.
      - generic [ref=e64]:
        - generic [ref=e65]:
          - generic [ref=e67]: 0–12 mo
          - generic [ref=e68]: Post-halving accumulation. Supply has just tightened; price often grinds sideways to slowly higher as the market digests the change.
        - generic [ref=e69]:
          - generic [ref=e71]: 12–18 mo
          - generic [ref=e72]: Historical uptrend window. In past cycles this is where the strongest advances clustered. Optimism builds, but the easy entries are usually behind.
        - generic [ref=e73]:
          - generic [ref=e75]: 18–24 mo
          - generic [ref=e76]: Late-cycle / topping risk. Euphoria and overheating have historically appeared here. A zone for managing risk, not chasing.
        - generic [ref=e77]:
          - generic [ref=e79]: 24+ mo
          - generic [ref=e80]: Drawdown / reset. Past cycles cooled into the run-up to the next halving, often bottoming near it. Patience over prediction.
    - generic [ref=e81]:
      - heading "4 Using it for buy timing" [level=2] [ref=e82]:
        - generic [ref=e83]: "4"
        - generic [ref=e84]: Using it for buy timing
      - paragraph [ref=e85]: The cycle works best as a backdrop, not a buy button. Knowing you're early in the cycle can lend patience to a dollar-cost-averaging plan, while knowing you're deep into the late-cycle window can be a cue to slow aggressive buying and review risk. The point is to frame your other indicators with cycle context, not to trade the calendar directly.
      - generic [ref=e86]:
        - generic [ref=e87]: Practical tip
        - paragraph [ref=e88]: Never trade the halving date itself. Price has historically reacted over months, not on the day. Pair the cycle position with valuation (MVRV-Z) and sentiment before committing capital.
    - generic [ref=e89]:
      - heading "5 Limits & common misreadings" [level=2] [ref=e90]:
        - generic [ref=e91]: "5"
        - generic [ref=e92]: Limits & common misreadings
      - paragraph [ref=e93]: Only three full cycles have completed, so the pattern is a small sample, not a law. The most common mistake is treating the timeline as a guaranteed calendar — 'it's month 14, so it must pump.' Markets don't owe history a repeat. As spot ETFs and institutional flows reshape demand, the rhythm may stretch, flatten, or weaken; peak magnitudes have already trended lower each cycle. Use the halving as context for where you might be, never as a promise of what comes next.
