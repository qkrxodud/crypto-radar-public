          - generic [ref=e80]: "Top zone. Price far above cost basis — historically an overheating warning. Note: peak readings have trended lower each cycle."
    - generic [ref=e81]:
      - heading "4 Using it for buy timing" [level=2] [ref=e82]:
        - generic [ref=e83]: "4"
        - generic [ref=e84]: Using it for buy timing
      - paragraph [ref=e85]: MVRV-Z is a valuation backdrop, not a trigger. A low or negative reading suggests the market is washed out and can lend conviction to a dollar-cost-averaging plan; a very high reading suggests it's stretched and is a cue to slow aggressive buying and review risk. Because it moves slowly, it answers 'roughly where are we in the cycle' far better than 'should I buy this week.'
      - generic [ref=e86]:
        - generic [ref=e87]: Practical tip
        - paragraph [ref=e88]: Don't expect precise tops or bottoms from it. Peak readings have fallen each cycle, so a fixed '7 = sell' rule can mislead. Pair MVRV-Z with cycle position and sentiment, and let it shape the size of your plan, not the exact day.
    - generic [ref=e89]:
      - heading "5 Limits & common misreadings" [level=2] [ref=e90]:
        - generic [ref=e91]: "5"
        - generic [ref=e92]: Limits & common misreadings
      - paragraph [ref=e93]: "The thresholds were calibrated on past cycles, and as the market matures the peaks have trended lower each cycle — so a level that screamed 'top' in 2017 may not recur. The biggest misread is treating it as a short-term timing tool: it updates slowly and is nearly useless for day or week trades. It can also sit in a zone for months without resolving. And like all valuation gauges, it describes condition, not catalyst — it tells you the market is stretched or washed out, not when that will change. Use it as slow-moving context, cross-checked with faster indicators."
