      - generic [ref=e29]: Cycle · Sentiment
      - heading "The MVRV-Z Score, in plain words" [level=1] [ref=e30]
      - paragraph [ref=e31]: The MVRV-Z Score compares Bitcoin's market price to what holders actually paid on average. When price runs far above that cost basis, the market looks stretched; when it dips below, it looks washed out. It's one of the cleaner long-term gauges of over- and under-valuation.
    - generic [ref=e32]:
      - generic [ref=e33]:
        - generic [ref=e34]: What it is
        - generic [ref=e35]: Price versus the market's average cost basis, scaled by volatility.
      - generic [ref=e36]:
        - generic [ref=e37]: How to read
        - generic [ref=e38]: 7+ has marked top zones, 0 or below bottom zones.
      - generic [ref=e39]:
        - generic [ref=e40]: Signal
        - generic [ref=e41]: Higher = overheated
    - generic [ref=e42]:
      - heading "1 What the MVRV-Z Score actually measures" [level=2] [ref=e43]:
        - generic [ref=e44]: "1"
        - generic [ref=e45]: What the MVRV-Z Score actually measures
      - paragraph [ref=e46]: "Price alone can't tell you whether Bitcoin is 'expensive.' Expensive compared to what? The MVRV-Z Score answers that by using the market's own purchase history as the yardstick. It asks: how far is today's price above or below what holders, on average, originally paid? When that gap is huge, late buyers are sitting on big paper gains and the market is prone to overheating; when the gap closes or goes negative, much of the market is underwater."
      - paragraph [ref=e47]: The 'Z' part rescales that gap by volatility, so a reading isn't distorted by Bitcoin simply being larger today than years ago. The result is a single number that lines up surprisingly well across cycles, which is why it's read as a long-term valuation gauge rather than a day-to-day signal.
    - generic [ref=e48]:
      - heading "2 How it's calculated" [level=2] [ref=e49]:
        - generic [ref=e50]: "2"
        - generic [ref=e51]: How it's calculated
      - paragraph [ref=e52]: "The score is built from three pieces. Don't worry about computing it by hand — the point is to understand what each piece represents:"
      - list [ref=e53]:
        - listitem [ref=e54]: Market cap — current price × circulating supply, i.e. today's headline value.
        - listitem [ref=e55]: Realized cap — each coin valued at the price it last moved, summed up. It approximates the market's aggregate cost basis.
        - listitem [ref=e56]: Standard deviation (σ) — of market cap, used to normalize the gap so cycles are comparable.
      - paragraph [ref=e57]:
        - text: "Putting them together:"
        - code [ref=e58]: MVRV-Z = (market cap − realized cap) ÷ σ
        - text: . In words — take how far today's value sits above the market's average cost, then scale it by how volatile the market has been. A big positive number means price is far above cost basis; a number near or below zero means it isn't.
    - generic [ref=e59]:
      - heading "3 Reading the zones" [level=2] [ref=e60]:
        - generic [ref=e61]: "3"
        - generic [ref=e62]: Reading the zones
      - paragraph [ref=e63]: The score is loosely split into zones drawn from past cycles. Treat the numbers as soft historical markers, not precise triggers.
      - generic [ref=e64]:
        - generic [ref=e65]:
          - generic [ref=e67]: ≤ 0
          - generic [ref=e68]: Bottom zone. Price is below the market's average cost — much of the market is underwater. Historically rare and aligned with long-term lows.
        - generic [ref=e69]:
          - generic [ref=e71]: 0–2
          - generic [ref=e72]: Undervalued-ish. Price modestly above cost basis. Often an early-cycle accumulation backdrop for patient buyers.
        - generic [ref=e73]:
