        - generic [ref=f50e51]: INDICATOR GUIDE
        - heading "Complex indicators, explained simply" [level=1] [ref=f50e52]
        - paragraph [ref=f50e53]: Every day we take the 25+ indicators shown on the dashboard, group them into 5 categories, score each from 0 to 100, and combine them with a weighted average into a single composite timing score. A lower score means the market is fearful — historically closer to buy-friendly zones — while a higher score signals greed and a need for caution. Come back anytime a term trips you up.
