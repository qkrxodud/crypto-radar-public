            - generic [ref=f50e150]: "1"
            - heading "Normalize to 0–100" [level=3] [ref=f50e151]
            - paragraph [ref=f50e152]: Indicators with wildly different units are all put onto a common 0–100 scale.
          - generic [ref=f50e153]:
            - generic [ref=f50e154]: "2"
            - heading "Apply weights" [level=3] [ref=f50e155]
            - paragraph [ref=f50e156]: Each category's importance (30/25/20/15/10%) is multiplied in and summed.
          - generic [ref=f50e157]:
            - generic [ref=f50e158]: "3"
            - heading "Interpret by band" [level=3] [ref=f50e159]
            - paragraph [ref=f50e160]: The summed score is read as a fear, neutral, or greed band.
        - generic [ref=f50e161]:
          - paragraph [ref=f50e162]:
            - text: 1) Normalize to 0–100. Every indicator uses a different unit — RSI runs 0–100, the funding rate is a tiny %, and DXY is an index near 100. Comparing them as-is is meaningless, so every indicator is converted to a common
            - code [ref=f50e163]: 0–100
            - text: score. Bounded indicators like RSI are mapped from their known range, while open-ended indicators are scored against their own recent historical distribution — judged by where they sit versus normal, not against an arbitrary fixed line.
          - paragraph [ref=f50e164]:
            - text: 2) Apply weights. The five categories are not equal. Slow, structural signals (cycle·sentiment, technical) get more weight than indirect ones (macro), giving
            - code [ref=f50e165]: 30 / 25 / 20 / 15 / 10%
            - text: ". Within each category the member indicators are averaged first, then multiplied by the category weight and summed. A simplified example: with Cycle 30, Technical 40, Derivatives 50, On-chain 35, Macro 60, the composite score is"
            - code [ref=f50e166]: 30×0.30 + 40×0.25 + 50×0.20 + 35×0.15 + 60×0.10 = 40.25
            - text: . This keeps any single indicator from dominating the result, and if data is missing the score simply shrinks rather than breaking.
          - paragraph [ref=f50e167]: 3) Interpret by band. The final 0–100 score is read against the five bands in 'How to read the score bands' above. The boundaries are signposts, not promises — a low score merely describes a statistically favorable backdrop and does not guarantee a rally.
