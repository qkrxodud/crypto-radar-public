    - generic [ref=e83]:
      - heading "4 Using it for buy timing" [level=2] [ref=e84]:
        - generic [ref=e85]: "4"
        - generic [ref=e86]: Using it for buy timing
      - paragraph [ref=e87]: The index works best as a context filter, not a trigger. When it sits in extreme fear, it's a cue to start looking for entries and to lean into a dollar-cost-averaging plan rather than waiting for a perfect bottom. When it's pinned in extreme greed, it's a cue to stop adding aggressively and to review how much risk you're carrying.
      - generic [ref=e88]:
        - generic [ref=e89]: Practical tip
        - paragraph [ref=e90]: Don't act on a single day's value. Watch whether the index stays in a zone for a week or more, and combine it with price and on-chain indicators before committing capital.
    - generic [ref=e91]:
      - heading "5 Limits & common misreadings" [level=2] [ref=e92]:
        - generic [ref=e93]: "5"
        - generic [ref=e94]: Limits & common misreadings
      - paragraph [ref=e95]: It reflects current emotion, not value, and in a strong trend it can stay pinned at an extreme for weeks. The most common mistake is treating extreme fear as an automatic buy or extreme greed as an automatic sell — in 2020–2021 greed stayed elevated for months while price kept rising. Use it to check whether the crowd is one-sided, not to call the exact turning point.
