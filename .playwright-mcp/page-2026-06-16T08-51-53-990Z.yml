      - heading "The Fear & Greed Index, in plain words" [level=1] [ref=e30]
      - paragraph [ref=e31]: The Fear & Greed Index sums up the market's mood in a single number from 0 to 100. 0 is extreme fear, 100 is extreme greed. It doesn't tell you what Bitcoin is worth — it tells you how the crowd feels right now, and that's exactly why it's useful for spotting moments when everyone has piled onto one side.
    - generic [ref=e32]:
      - generic [ref=e33]:
        - generic [ref=e34]: What it is
        - generic [ref=e35]: A 0–100 gauge of overall market crowd psychology.
      - generic [ref=e36]:
        - generic [ref=e37]: How to read
        - generic [ref=e38]: Lower = more fear, historically a better buying zone.
      - generic [ref=e39]:
        - generic [ref=e40]: Signal
        - generic [ref=e41]: Lower = buying opportunity
    - generic [ref=e42]:
      - heading "1 What the Fear & Greed Index actually measures" [level=2] [ref=e43]:
        - generic [ref=e44]: "1"
        - generic [ref=e45]: What the Fear & Greed Index actually measures
      - paragraph [ref=e46]: Price tells you what the market did. The Fear & Greed Index tries to tell you what the market feels. It compresses several separate signals of crowd emotion into one easy number, so that instead of checking volatility, volume, and social chatter one by one, you can glance at a single 0–100 reading.
      - paragraph [ref=e47]: "The core idea behind it is contrarian: markets tend to bottom when fear is at its worst and everyone has already sold, and tend to overheat when greed is universal and there's no one left to buy. The index is a way to quantify how lopsided the crowd has become."
    - generic [ref=e48]:
      - heading "2 How it's calculated" [level=2] [ref=e49]:
        - generic [ref=e50]: "2"
        - generic [ref=e51]: How it's calculated
      - paragraph [ref=e52]:
        - text: Several inputs are each scored and blended into a single
        - code [ref=e53]: 0–100
        - text: "number, then smoothed over recent days. The most widely cited version (Alternative.me) weights roughly like this:"
      - list [ref=e54]:
        - listitem [ref=e55]: Volatility (~25%) — how far current price swings stray from the recent norm.
        - listitem [ref=e56]: Momentum & volume (~25%) — buying volume and momentum versus their averages.
        - listitem [ref=e57]: Social media (~15%) — the volume and tone of chatter on social platforms.
        - listitem [ref=e58]: Bitcoin dominance (~10%) — Bitcoin's share of the total crypto market.
        - listitem [ref=e59]: Surveys & trends (~25%) — poll data and search-trend interest.
      - paragraph [ref=e60]: You don't need to memorize the weights. The takeaway is that it's a blend of emotion signals, not a price model — so it moves with mood, not with fundamentals.
