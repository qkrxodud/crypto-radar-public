      - generic [ref=f24e58]:
        - generic [ref=f24e59]: Macro
        - heading "The Dollar Index (DXY), in plain terms" [level=1] [ref=f24e62]
        - paragraph [ref=f24e63]: The Dollar Index measures how strong the US dollar is against a basket of major currencies. It's not a crypto indicator at all, but because the dollar is the pricing benchmark for risk assets worldwide, a weak dollar tends to be a tailwind for Bitcoin and a strong dollar a headwind. DXY is the macro backdrop that other indicators move on top of.
      - generic [ref=f24e64]:
        - generic [ref=f24e65]:
          - generic [ref=f24e66]: What it is
          - generic [ref=f24e67]: An index showing the dollar's strength against 6 major currencies.
        - generic [ref=f24e68]:
          - generic [ref=f24e69]: How to read it
          - generic [ref=f24e70]: DXY down = weak dollar, historically more favorable to risk assets.
        - generic [ref=f24e71]:
          - generic [ref=f24e72]: Signal
          - generic [ref=f24e73]: Weak dollar = crypto-friendly
      - generic [ref=f24e74]:
        - heading "1 What the Dollar Index measures" [level=2] [ref=f24e75]:
          - generic [ref=f24e76]: "1"
          - generic [ref=f24e77]: What the Dollar Index measures
        - paragraph [ref=f24e78]: DXY is a single number that answers one question — is the US dollar getting stronger or weaker against other major currencies? If a dollar buys more euros, yen, or pounds than before, the index rises; if it buys less, it falls. It says nothing directly about Bitcoin — what it measures is the dollar.
        - paragraph [ref=f24e79]: Why would a Bitcoin dashboard care about a currency index? Because the dollar is the world's reserve currency and the unit in which risk is priced. When the dollar is strong, global liquidity tightens, dollar borrowing costs rise, and money tends to flow from speculative assets to the safety of cash. When the dollar is weak, the opposite happens — liquidity loosens and capital seeks higher returns, which historically has included Bitcoin.
      - generic [ref=f24e80]:
        - heading "2 How it's calculated" [level=2] [ref=f24e81]:
          - generic [ref=f24e82]: "2"
          - generic [ref=f24e83]: How it's calculated
        - paragraph [ref=f24e84]: DXY is a weighted geometric average of the dollar's exchange rates against 6 currencies. The weights are fixed values set decades ago, so the euro's share is overwhelmingly the largest.
        - list [ref=f24e85]:
          - listitem [ref=f24e86]: Euro (EUR, ~57.6%) — by far the largest share, so DXY is effectively a dollar-versus-euro story.
          - listitem [ref=f24e87]: Japanese yen (JPY, ~13.6%) — the second-largest share.
          - listitem [ref=f24e88]: British pound (GBP, ~11.9%), Canadian dollar (CAD, ~9.1%).
          - listitem [ref=f24e89]: Swedish krona (SEK, ~4.2%), Swiss franc (CHF, ~3.6%) — the smallest slices.
        - paragraph [ref=f24e90]:
          - text: You don't need to calculate it yourself — the value is quoted everywhere as a single index level (often around
          - code [ref=f24e91]: "100"
          - text: ). The key point is that DXY does not include the Korean won, Chinese yuan, or most emerging-market currencies. So it's a 'dollar strength against developed markets' gauge, not a direct measure of the dollar's value against every currency.
      - generic [ref=f24e92]:
        - heading "3 Reading it by direction" [level=2] [ref=f24e93]:
          - generic [ref=f24e94]: "3"
          - generic [ref=f24e95]: Reading it by direction
        - paragraph [ref=f24e96]: DXY has no fixed 'buy line' — what matters is not a magic number but its direction and trend. The table below describes how each move has tended to color the backdrop for risk assets like Bitcoin.
        - generic [ref=f24e97]:
