      - generic [ref=f24e114]:
        - heading "4 How to use it for buy timing" [level=2] [ref=f24e115]:
          - generic [ref=f24e116]: "4"
          - generic [ref=f24e117]: How to use it for buy timing
        - paragraph [ref=f24e118]: DXY is not a trigger that reacts every day but a slow background variable. Its best use is as a check — when you see a constructive on-chain or technical setup, take a look at whether the dollar is a tailwind (falling) or working against you (rising). A favorable Bitcoin setup that appears while the dollar is climbing steeply is worth more caution, and the same setup alongside a weak dollar has more wind at its back.
        - generic [ref=f24e119]:
          - generic [ref=f24e120]: Practical tip
          - paragraph [ref=f24e121]: Don't trade DXY's momentary swings. Look at the trend over several weeks and read it alongside the Fed's policy direction — DXY often moves with expectations of rate hikes (dollar up) or cuts (dollar down). DXY defines the environment; timing is the job of on-chain and derivatives indicators.
      - generic [ref=f24e122]:
        - heading "5 Limits and common misconceptions" [level=2] [ref=f24e123]:
          - generic [ref=f24e124]: "5"
          - generic [ref=f24e125]: Limits and common misconceptions
        - paragraph [ref=f24e126]: The inverse correlation between the dollar and Bitcoin is a loose tendency, not a law, and it breaks for stretches — there have been periods when the two rose together or fell together. The most common mistake is treating DXY as a precise timing signal. It's an indirect, slow macro influence, so reacting to small daily wobbles is just noise. It also excludes the won and yuan, so it doesn't capture dollar strength against emerging markets, and FX markets can move for reasons unrelated to crypto (a European crisis, yen intervention).
      - generic [ref=f24e127]:
        - heading "6 Worked example & a real case" [level=2] [ref=f24e128]:
          - generic [ref=f24e129]: "6"
          - generic [ref=f24e130]: Worked example & a real case
        - generic [ref=f24e131]:
          - generic [ref=f24e132]: Worked example
          - paragraph [ref=f24e133]: "Suppose DXY moves from 95 to 105 — that's roughly a +10.5% dollar gain ((105−95)÷95×100). The DXY itself is a weighted index of the dollar against six currencies (euro, yen, pound, and others), so it isn't a direct Bitcoin price. Instead, read it as a backdrop: over the same stretch, a stronger dollar tends to coincide with pressure on risk assets like Bitcoin. If BTC slipped, say, from around $45,000 to $40,000 while DXY climbed that 10%, the two moving in opposite directions is the inverse-correlation pattern in action. The numbers here are illustrative, not observed readings."
        - paragraph [ref=f24e134]: A clear real-world case was 2022. Through that year the Fed raised rates aggressively, the dollar surged, and the DXY climbed toward multi-decade highs around the autumn. Over the same span Bitcoin fell steeply — from roughly $47,000 early in the year down to about $15,500 near the November FTX collapse. It wasn't the dollar alone driving Bitcoin, but the strong-dollar, tight-liquidity backdrop lined up with a broad risk-off move. The episode shows why DXY is watched as a slow macro tailwind or headwind rather than a precise entry signal.
