            - generic [ref=f24e99]: Sharp drop
            - generic [ref=f24e101]: Rapid dollar weakness. A phase of loosening liquidity. Historically the most favorable macro backdrop for risk assets including Bitcoin.
          - generic [ref=f24e102]:
