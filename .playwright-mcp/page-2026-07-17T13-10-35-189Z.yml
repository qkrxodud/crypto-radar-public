      - generic [ref=e470]:
        - heading "How to read Bitcoin buy timing with data" [level=2] [ref=e471]
        - generic [ref=e472]: What this dashboard does, in plain terms
        - paragraph [ref=e473]: Bitcoin's price is driven as much by sentiment as by fundamentals, and no single number can pinpoint the exact bottom. Every day this dashboard gathers 25+ market indicators, scores each from 0 to 100, and combines them into one composite timing score. The lower the score, the more fear grips the market — historically closer to a buying zone; the higher it is, the more greed and caution are warranted.
        - generic [ref=e474]:
          - generic [ref=e475]:
            - generic [ref=e476]: Cycle · Sentiment
            - generic [ref=e477]: 30%
          - generic [ref=e478]:
            - generic [ref=e479]: Technical
            - generic [ref=e480]: 25%
          - generic [ref=e481]:
            - generic [ref=e482]: Derivatives
            - generic [ref=e483]: 20%
          - generic [ref=e484]:
            - generic [ref=e485]: On-chain
            - generic [ref=e486]: 15%
          - generic [ref=e487]:
            - generic [ref=e488]: Macro
            - generic [ref=e489]: 10%
        - heading "Why read many indicators together" [level=3] [ref=e490]
        - paragraph [ref=e491]: No single number can pin down the bottom or the top. RSI can flash oversold for weeks in a downtrend, the funding rate can turn negative and still fall further, and a positive ETF inflow does not guarantee a rally on its own. Each indicator only captures one slice of the market, so relying on one is like judging the weather from a single thermometer.
        - paragraph [ref=e492]: "That is why we spread the reading across five categories — cycle·sentiment, technical, derivatives, on-chain, and macro — and cross-check them. They look at different layers: cycle and sentiment describe the slow, structural backdrop; technical reads recent price behavior; derivatives reveal how leveraged traders are positioned; on-chain shows what actual coin holders are doing; and macro places Bitcoin within the wider risk-asset environment. When several categories point the same way at once, the signal is far more trustworthy than any one of them alone."
        - paragraph [ref=e493]: "Signals will often conflict — one category says fear while another says overheating. That is not a flaw but useful information: it usually means the market has no clear edge in either direction, and the neutral band exists to describe exactly that. Rather than forcing a single answer, treat a conflict as a reason to move more slowly and in stages."
        - heading "How the score is calculated, in three steps" [level=3] [ref=e494]
        - paragraph [ref=e495]:
          - text: ① Normalize to 0–100. Every indicator uses a different unit — RSI runs 0–100, the funding rate is a tiny percentage, DXY is an index near 100. Comparing them as-is is meaningless, so each is converted onto a common
          - code [ref=e496]: 0–100
          - text: scale. Bounded indicators are mapped from their known range, and open-ended ones are scored against their own recent history — by where they sit versus normal, not against a fixed line.
        - paragraph [ref=e497]:
          - text: ② Apply category weights and sum. The five categories are not equal. Slower, structural signals get more weight than indirect ones, giving
          - code [ref=e498]: 30 / 25 / 20 / 15 / 10%
          - text: . Each category's member indicators are averaged first, then multiplied by its weight and added up. For example, if the normalized category scores were Cycle 30, Technical 40, Derivatives 50, On-chain 35, Macro 60, the composite would be
          - code [ref=e499]: 30×0.30 + 40×0.25 + 50×0.20 + 35×0.15 + 60×0.10 = 40.25
          - text: . This keeps any single indicator from dominating the outcome.
        - paragraph [ref=e500]: "③ Interpret by band. The final 0–100 score is read as a fear, neutral, or greed band. A low score means fear is widespread — historically often closer to a long-term buying zone; a high score means greed and overheating, a time for caution. The boundaries are signposts, not promises: a low score describes a statistically favorable backdrop and never guarantees a rise."
