        - paragraph [ref=e55]: MACD(이동평균수렴확산)는 가격의 단기 평균과 장기 평균의 간격을 읽어 모멘텀이 언제 바뀌는지를 포착합니다. 두 선이 교차하면 추세 전환 신호이고, 0선 위는 상승, 아래는 하락 우위입니다. 가격을 예측하는 게 아니라, 움직임이 힘을 얻고 있는지 잃고 있는지를 확인해 줍니다.
