      - generic [ref=e57]:
        - generic [ref=e60]: Technical Analysis
        - heading "RSI, the speedometer of price" [level=1] [ref=e61]
        - paragraph [ref=e62]: RSI (Relative Strength Index) measures how fast and strongly price has moved recently on a 0–100 scale. Above 70 it has risen too fast (overbought); below 30 it has fallen too fast (oversold). It doesn't tell you where price is headed — it tells you whether the recent move has stretched too far, too fast.
      - generic [ref=e63]:
        - generic [ref=e64]:
          - generic [ref=e65]: What it is
          - generic [ref=e66]: An indicator that scores how strong recent gains have been versus losses, from 0 to 100.
        - generic [ref=e67]:
          - generic [ref=e68]: How to read it
          - generic [ref=e69]: Above 70 is overheated, below 30 is depressed. The 50 line is a rough trend boundary.
        - generic [ref=e70]:
          - generic [ref=e71]: Signal
          - generic [ref=e72]: Oversold = watch for entry
      - generic [ref=e73]:
        - heading "1 What RSI measures" [level=2] [ref=e74]:
          - generic [ref=e75]: "1"
          - generic [ref=e76]: What RSI measures
        - paragraph [ref=e77]: Price tells you the level. RSI tells you the momentum — how far recent moves have leaned toward gains versus losses. If almost every recent candle closed up, RSI climbs toward 100; if almost all closed down, it falls toward 0. So a high RSI doesn't mean price is high in absolute terms — it means the recent rise has been fast and one-sided.
        - paragraph [ref=e78]: The core idea is that moves that are too fast usually pause to catch their breath. A market that rallies without rest often stalls or pulls back to recover, and a market that plunges often bounces. RSI is a tool that puts a number on how stretched that recent move has become.
      - generic [ref=e79]:
        - heading "2 How it is calculated" [level=2] [ref=e80]:
          - generic [ref=e81]: "2"
          - generic [ref=e82]: How it is calculated
        - paragraph [ref=e83]:
          - text: Over a set period — most commonly
          - code [ref=e84]: "14"
          - text: candles — RSI compares the average of the up moves with the average of the down moves, then maps that ratio onto a 0–100 scale.
        - list [ref=e85]:
          - listitem [ref=e86]: Step 1. Split each candle's change into gains and losses, and average each over the period.
          - listitem [ref=e87]:
            - text: Step 2. Form the ratio
            - code [ref=e88]: RS = average gain ÷ average loss
            - text: .
          - listitem [ref=e89]:
            - text: Step 3. Convert with
            - code [ref=e90]: RSI = 100 − 100 ÷ (1 + RS)
            - text: ", which always lands between 0 and 100."
        - paragraph [ref=e91]: You don't need to compute it by hand. The key point is that RSI is a smoothed ratio of recent buying strength to selling strength. When buyers dominate it rises; when sellers dominate it falls. A shorter period makes it more sensitive, a longer one calmer.
      - generic [ref=e92]:
        - heading "3 Reading it by zone" [level=2] [ref=e93]:
          - generic [ref=e94]: "3"
          - generic [ref=e95]: Reading it by zone
        - paragraph [ref=e96]: The 0–100 scale has a few well-known zones. Treat them as gradual shifts rather than hard lines, and remember that the same number can mean different things in a quiet market versus a strong trend.
        - generic [ref=e97]:
          - generic [ref=e98]:
            - generic [ref=e100]: 0–30
            - generic [ref=e101]: Oversold. A phase of intense recent selling. The likelihood of a bounce rises, but in a strong downtrend it can stay here for a while.
          - generic [ref=e102]:
            - generic [ref=e104]: 30–50
            - generic [ref=e105]: Weak / below the midline. Sellers still hold a slight edge. This is often where patient buyers accumulate in tranches.
          - generic [ref=e106]:
            - generic [ref=e108]: 50–70
            - generic [ref=e109]: Strong / above the midline. Buyers hold the edge. Momentum can run further, but the easy oversold entry zone has passed.
          - generic [ref=e110]:
            - generic [ref=e112]: 70–100
            - generic [ref=e113]: Overbought. A phase of hot recent buying. A warning to hold off on chasing — in a strong uptrend RSI can stay above 70, so it is not a precise sell signal.
      - generic [ref=e114]:
        - heading "4 How to use it for buy timing" [level=2] [ref=e115]:
          - generic [ref=e116]: "4"
          - generic [ref=e117]: How to use it for buy timing
        - paragraph [ref=e118]: RSI works best as a timing filter layered on top of a trend read, not as a standalone trigger. In an uptrend, a pullback that drops RSI toward 40–50 is often a better entry than buying while it is pinned near 70. In a downtrend, an oversold entry can offer a bounce, but fighting the larger trend is risky. For many traders the most useful reading is divergence — price makes a new extreme but RSI does not — a hint that the move is losing strength.
        - generic [ref=e119]:
          - generic [ref=e120]: Practical tip
          - paragraph [ref=e121]: Don't act on a single timeframe. Look at daily, weekly, and monthly RSI together. Daily oversold within a healthy weekly uptrend and daily oversold within a falling weekly trend are completely different situations. Judge RSI alongside price structure before committing capital.
      - generic [ref=e122]:
        - heading "5 Limits and common misreadings" [level=2] [ref=e123]:
          - generic [ref=e124]: "5"
          - generic [ref=e125]: Limits and common misreadings
        - paragraph [ref=e126]: RSI measures the speed of recent moves, not value, and in a strong trend it can stay overbought or oversold for a long time. The most common mistake is treating 70 as an automatic sell and 30 as an automatic buy. In Bitcoin's strong bull runs RSI has held above 70 for weeks while price kept climbing, and in deep sell-offs it has stayed below 30 while price fell further. RSI says nothing about the size of the move or fundamentals. Use it to gauge whether the recent move has stretched rather than to pinpoint exact turning points, and lean on divergence and multi-timeframe context rather than a single threshold.
