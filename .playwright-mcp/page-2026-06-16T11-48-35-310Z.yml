    - heading "Why we gathered these five categories" [level=3] [ref=e276]
    - paragraph [ref=e277]: A single indicator only captures one facet of the market. Price alone can't tell whether the move is driven by overheated leverage or by real on-chain accumulation. By blending five angles, we aim to reduce the blind spots of any one number.
    - generic [ref=e278]:
      - generic [ref=e279]:
        - img [ref=e281]
        - heading "Cycle · Sentiment leads the rest" [level=3] [ref=e284]
        - paragraph [ref=e285]: Where we stand in the multi-year halving cycle and how greedy or fearful the crowd is together set the broad backdrop. MVRV-Z (how far price sits above or below the average cost of all coins) and NUPL (the share of holders sitting in unrealized profit) help locate that phase.
      - generic [ref=e286]:
        - img [ref=e288]
        - heading "Technicals show trend strength" [level=3] [ref=e291]
        - paragraph [ref=e292]: Multi-timeframe RSI (a 0–100 gauge of whether price has risen or fallen too fast) and the distance from the 200-day moving average describe how stretched the current trend is, without making a forecast.
      - generic [ref=e293]:
        - img [ref=e295]
        - heading "Derivatives reveal overheating" [level=3] [ref=e297]
        - paragraph [ref=e298]: The funding rate (the periodic fee longs and shorts pay each other in perpetual futures) and open interest hint at how much borrowed money is crowding into one side — a common precursor to sharp reversals.
      - generic [ref=e299]:
        - img [ref=e301]
        - heading "On-chain shows real behavior" [level=3] [ref=e304]
        - paragraph [ref=e305]: SOPR (whether coins are being moved at a profit or a loss) and the split between long- and short-term holders reveal whether participants are actually spending or holding, beyond what price alone implies.
      - generic [ref=e306]:
        - img [ref=e308]
        - heading "Macro sets the outer weather" [level=3] [ref=e311]
        - paragraph [ref=e312]: The dollar index (DXY), equity markets, and spot ETF flows shape the liquidity environment that Bitcoin floats in. They carry the smallest weight because their link to BTC is indirect and shifts over time.
      - generic [ref=e313]:
        - img [ref=e315]
        - heading "Together, not alone" [level=3] [ref=e318]
        - paragraph [ref=e319]: No category is treated as decisive on its own. The composite score is meant to summarize where most signals agree and disagree — not to predict tomorrow's price.
