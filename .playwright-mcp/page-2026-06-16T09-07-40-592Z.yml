    - generic [ref=e81]:
      - heading "4 Using it for buy timing" [level=2] [ref=e82]:
        - generic [ref=e83]: "4"
        - generic [ref=e84]: Using it for buy timing
      - paragraph [ref=e85]: Funding works best as a crowding filter, not a trigger. When the rate has been deeply negative for a while — shorts paying to stay short near a sold-off price — it can hint that bearish positioning is stretched and a relief bounce is more likely. When the rate is pinned strongly positive during a sharp rally, it's a cue to be careful about chasing, since a long-heavy market is fuel for a sudden flush.
      - generic [ref=e86]:
        - generic [ref=e87]: Practical tip
        - paragraph [ref=e88]: Don't act on a single funding print. Watch whether the rate stays extreme across several settlements, and confirm it with open interest and price action before committing capital.
    - generic [ref=e89]:
      - heading "5 Limits & common misreadings" [level=2] [ref=e90]:
        - generic [ref=e91]: "5"
        - generic [ref=e92]: Limits & common misreadings
      - paragraph [ref=e93]: Funding shows positioning, not timing — an overheated market can stay overheated for weeks while price keeps rising. The most common mistake is treating high funding as an instant short or negative funding as an instant buy. Rates also differ across exchanges and can be skewed by a few large players, so a single venue's number isn't the whole picture. Read it as a contrarian warning about crowding, alongside open interest and price — never as a precise turning-point signal.
