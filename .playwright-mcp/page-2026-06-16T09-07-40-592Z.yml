      - heading "The funding rate, in plain words" [level=1] [ref=e30]
      - paragraph [ref=e31]: The funding rate is a small fee that one side of the perpetual-futures market pays the other every few hours. When it's strongly positive, longs are paying — meaning the crowd is leaning bullish; when it's negative, shorts are paying. It doesn't tell you where price is headed — it tells you how lopsided the leveraged crowd has become.
    - generic [ref=e32]:
      - generic [ref=e33]:
        - generic [ref=e34]: What it is
        - generic [ref=e35]: A periodic fee that keeps perpetual futures tethered to spot price.
      - generic [ref=e36]:
        - generic [ref=e37]: How to read
        - generic [ref=e38]: High positive = longs crowded, often a correction-risk warning.
      - generic [ref=e39]:
        - generic [ref=e40]: Signal
        - generic [ref=e41]: Crowding = contrarian cue
    - generic [ref=e42]:
      - heading "1 What the funding rate actually measures" [level=2] [ref=e43]:
        - generic [ref=e44]: "1"
        - generic [ref=e45]: What the funding rate actually measures
      - paragraph [ref=e46]: Price tells you what the market did. The funding rate tells you which side of the leveraged crowd is too eager. Because perpetual futures have no expiry date, exchanges need a mechanism to keep their price from drifting away from the real spot price — and that mechanism is funding. The side that's piling on pays the side that's holding back, which makes the rate a direct readout of positioning bias.
      - paragraph [ref=e47]: "The core idea behind reading it is contrarian: when nearly everyone has borrowed money to bet in the same direction, there are few buyers (or sellers) left to push the move further, and the crowded side becomes vulnerable to a sudden reversal. The funding rate is one of the cleanest ways to see that crowding build up in real time."
    - generic [ref=e48]:
      - heading "2 How it's calculated" [level=2] [ref=e49]:
        - generic [ref=e50]: "2"
        - generic [ref=e51]: How it's calculated
      - paragraph [ref=e52]:
        - text: On a perpetual contract, funding is settled at fixed intervals — most exchanges use
        - code [ref=e53]: every 8 hours
        - text: ". The rate is driven by how far the futures price drifts from spot: when futures trade above spot, longs pay shorts; when futures trade below spot, shorts pay longs. The payment nudges traders to push the contract price back toward the spot price."
      - list [ref=e54]:
        - listitem [ref=e55]: Premium component — how much the perpetual price sits above or below the underlying spot/index price.
        - listitem [ref=e56]: Interest component — a small baseline rate reflecting the cost of holding the position.
        - listitem [ref=e57]: Settlement interval — the fee is exchanged periodically (commonly 8 hours), not continuously.
      - paragraph [ref=e58]: You don't need to compute it yourself. The takeaway is that funding is a balancing fee driven by demand imbalance — it rises when one side gets greedy and falls when the other side does, so its sign and size map directly to crowd positioning.
    - generic [ref=e59]:
      - heading "3 Reading the zones" [level=2] [ref=e60]:
        - generic [ref=e61]: "3"
        - generic [ref=e62]: Reading the zones
      - paragraph [ref=e63]: Funding has no fixed scale, so judge it against its own recent range. As a rough guide, traders often frame it around a neutral baseline of about 0.01% per 8 hours.
