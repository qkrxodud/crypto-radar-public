      - generic [ref=f56e219]:
        - generic [ref=f56e220]:
          - heading "Why bring these five categories together?" [level=2] [ref=f56e221]
          - generic [ref=f56e222]: To narrow the blind spots a single number can miss
        - paragraph [ref=f56e223]: A single indicator shows only one facet of the market. Price alone makes it hard to tell whether a move is driven by overheated leverage or by real on-chain accumulation. Blending five angles helps narrow the blind spots a single number can miss.
        - generic [ref=f56e224]:
          - generic [ref=f56e225]:
            - img [ref=f56e227]
            - generic [ref=f56e230]: Cycle · Sentiment sets the big picture
            - generic [ref=f56e231]: Where we sit in the halving cycle, and how greedy or fearful the crowd is, sets the broad backdrop. MVRV-Z (how high or low the current price sits versus the average cost basis of all coins) and NUPL (the share of holders sitting in unrealized profit) help gauge that phase.
          - generic [ref=f56e232]:
            - img [ref=f56e234]
            - generic [ref=f56e237]: Technical analysis reads trend strength
            - generic [ref=f56e238]: Multi-timeframe RSI (a 0–100 gauge of whether price has risen or fallen too fast) and the distance from the 200-day moving average describe how stretched the current trend is — without predicting.
          - generic [ref=f56e239]:
            - img [ref=f56e241]
            - generic [ref=f56e243]: Derivatives reveal froth
            - generic [ref=f56e244]: The funding rate that longs and shorts pay each other on perpetual futures, together with open interest, hints at how lopsided the borrowed money has become. It's a signal that often shows up ahead of sharp reversals.
          - generic [ref=f56e245]:
            - img [ref=f56e247]
            - generic [ref=f56e250]: On-chain shows real behavior
            - generic [ref=f56e251]: SOPR (whether coins are moving while in profit or at a loss) and the balance of long- vs. short-term holders show whether participants are actually selling or holding — something price alone can't reveal.
          - generic [ref=f56e252]:
            - img [ref=f56e254]
            - generic [ref=f56e257]: Macro sets the outside weather
            - generic [ref=f56e258]: The dollar index (DXY), equity markets, and spot ETF flows shape the liquidity environment Bitcoin floats in. Because their link to BTC is indirect and shifts over time, this carries the smallest weight.
          - generic [ref=f56e259]:
            - img [ref=f56e261]
            - generic [ref=f56e264]: Together, not alone
            - generic [ref=f56e265]: No single category is treated as decisive on its own. The composite score summarizes where most signals agree or diverge — it isn't a prediction of tomorrow's price.
      - generic [ref=f56e266]:
